<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="style.css">

<body>

  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<canvas id="confetti"></canvas>

    <img src="assets/foto1.jpg">

  </div>
  <h2>kesayangannya all 🤭</h2>
</section>

<section id="closing" class="hidden">
  <div class="card">
    <h2>I’m really lucky to have you, sekali lagi selamat ulang tahun yaa 💖</h2>
  </div>

<script src="script.js"></script>
